    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.69.1",
]

[dependency-groups]
controlnet = [
    "datasets>=5.0.1",
    "diffusers>=0.39.0",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pycocotools>=2.0.11",
    "transformers>=5.14.1",
]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
