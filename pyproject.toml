description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "opencv-python[controlnet]>=5.0.0.93",
]

[project.optional-dependencies]
